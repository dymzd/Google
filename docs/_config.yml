# Jekyll served the repository name as the site title, so the homepage rendered
# an <h1> reading "Google" above the real one. On a page whose whole job is to
# prove this app is not Google's, that was the worst possible default.
title: Secure Gateway Studio
# Short on purpose: jekyll-seo-tag builds <title> as "title | description".
description: Fast-track deployment and evaluation tool for Chrome Enterprise Premium and BeyondCorp Security Gateway

# Search Console ownership token, rendered into <head> by jekyll-seo-tag.
# OAuth branding verification requires the homepage domain to be verified.
google_site_verification: "KPLcoHPuwZwhqrmoM0CXo62OLUak0xZBJ5VYBLa1pts"

theme: minima
plugins:
  - jekyll-seo-tag

# The implementation plans are reference material, not part of the site. They
# now live in docs-internal/, outside the Pages source, so they no longer need
# excluding here. Only the Tailwind build inputs remain.
exclude:
  - assets/css/tailwind.input.css
  - tailwind.config.cjs
