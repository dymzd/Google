name: Secure Gateway Studio CI

on:
  pull_request:
    paths:
      - "secure-gateway-studio/**"
      - "docs/CHROME_SECURE_GATEWAY_WEB_APP_IMPLEMENTATION_PLAN.md"
      - ".github/workflows/secure-gateway-studio-ci.yml"
  push:
    paths:
      - "secure-gateway-studio/**"
      - "docs/CHROME_SECURE_GATEWAY_WEB_APP_IMPLEMENTATION_PLAN.md"
      - ".github/workflows/secure-gateway-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-gateway-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: secure-gateway-studio/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.0
          uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest --cov=sgstudio --cov-report=term-missing --cov-fail-under=75

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: secure-gateway-studio/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: "11.9.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: secure-gateway-studio/frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test -- --run
      - name: Build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
